<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Scene: Same CPU but now relaxing at 9% with sunglasses, cameras organized nicely -->

  <!-- Background -->
  <rect width="400" height="400" fill="#E8F5E9" rx="20"/>

  <!-- Sunshine in corner -->
  <g transform="translate(50, 50)">
    <circle cx="0" cy="0" r="25" fill="#FFC107" opacity="0.6"/>
    <g stroke="#FFC107" stroke-width="2" opacity="0.4">
      <line x1="0" y1="-40" x2="0" y2="-32"/>
      <line x1="28" y1="-28" x2="23" y2="-23"/>
      <line x1="40" y1="0" x2="32" y2="0"/>
      <line x1="28" y1="28" x2="23" y2="23"/>
    </g>
  </g>

  <!-- CPU chip body - cool and happy -->
  <g transform="translate(200, 200)">
    <!-- CPU package -->
    <rect x="-70" y="-70" width="140" height="140" rx="8" fill="#66BB6A"/>
    <rect x="-60" y="-60" width="120" height="120" rx="6" fill="#43A047"/>

    <!-- CPU die -->
    <rect x="-40" y="-40" width="80" height="80" rx="4" fill="#2E7D32"/>

    <!-- CPU pins -->
    <g fill="#81C784">
      <rect x="-80" y="-50" width="12" height="4" rx="1"/>
      <rect x="-80" y="-30" width="12" height="4" rx="1"/>
      <rect x="-80" y="-10" width="12" height="4" rx="1"/>
      <rect x="-80" y="10" width="12" height="4" rx="1"/>
      <rect x="-80" y="30" width="12" height="4" rx="1"/>
      <rect x="-80" y="50" width="12" height="4" rx="1"/>
      <rect x="68" y="-50" width="12" height="4" rx="1"/>
      <rect x="68" y="-30" width="12" height="4" rx="1"/>
      <rect x="68" y="-10" width="12" height="4" rx="1"/>
      <rect x="68" y="10" width="12" height="4" rx="1"/>
      <rect x="68" y="30" width="12" height="4" rx="1"/>
      <rect x="68" y="50" width="12" height="4" rx="1"/>
    </g>

    <!-- "9%" on the CPU -->
    <text x="0" y="-5" text-anchor="middle" font-family="Impact, sans-serif" font-size="36" fill="white">9%</text>
    <text x="0" y="18" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#C8E6C9">CPU</text>

    <!-- Sunglasses -->
    <g transform="translate(0, -35)">
      <rect x="-28" y="-6" width="22" height="14" rx="3" fill="#1a1a1a"/>
      <rect x="6" y="-6" width="22" height="14" rx="3" fill="#1a1a1a"/>
      <line x1="-6" y1="1" x2="6" y2="1" stroke="#1a1a1a" stroke-width="2"/>
      <line x1="-28" y1="0" x2="-35" y2="-4" stroke="#1a1a1a" stroke-width="2"/>
      <line x1="28" y1="0" x2="35" y2="-4" stroke="#1a1a1a" stroke-width="2"/>
      <!-- Lens shine -->
      <line x1="-22" y1="-3" x2="-16" y2="-3" stroke="white" stroke-width="1" opacity="0.4"/>
      <line x1="12" y1="-3" x2="18" y2="-3" stroke="white" stroke-width="1" opacity="0.4"/>
    </g>

    <!-- Happy smile -->
    <path d="M-15,42 Q0,55 15,42" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Organized cameras in a neat row at top -->
  <g transform="translate(0, 55)">
    <g fill="#78909C">
      <g transform="translate(65, 0) scale(0.3)">
        <rect x="-25" y="-12" width="50" height="24" rx="4"/>
        <circle cx="30" cy="0" r="12"/>
        <circle cx="-18" cy="-8" r="3" fill="#4CAF50"/>
      </g>
      <g transform="translate(120, 0) scale(0.3)">
        <rect x="-25" y="-12" width="50" height="24" rx="4"/>
        <circle cx="30" cy="0" r="12"/>
        <circle cx="-18" cy="-8" r="3" fill="#4CAF50"/>
      </g>
      <g transform="translate(175, 0) scale(0.3)">
        <rect x="-25" y="-12" width="50" height="24" rx="4"/>
        <circle cx="30" cy="0" r="12"/>
        <circle cx="-18" cy="-8" r="3" fill="#4CAF50"/>
      </g>
      <g transform="translate(230, 0) scale(0.3)">
        <rect x="-25" y="-12" width="50" height="24" rx="4"/>
        <circle cx="30" cy="0" r="12"/>
        <circle cx="-18" cy="-8" r="3" fill="#4CAF50"/>
      </g>
      <g transform="translate(285, 0) scale(0.3)">
        <rect x="-25" y="-12" width="50" height="24" rx="4"/>
        <circle cx="30" cy="0" r="12"/>
        <circle cx="-18" cy="-8" r="3" fill="#4CAF50"/>
      </g>
      <g transform="translate(340, 0) scale(0.3)">
        <rect x="-25" y="-12" width="50" height="24" rx="4"/>
        <circle cx="30" cy="0" r="12"/>
        <circle cx="-18" cy="-8" r="3" fill="#4CAF50"/>
      </g>
    </g>
    <!-- "x62" label -->
    <text x="370" y="5" font-family="Consolas, monospace" font-size="11" fill="#4CAF50">x62</text>
  </g>

  <!-- Musical notes (chilling vibes) -->
  <g fill="#66BB6A" opacity="0.5">
    <text x="310" y="160" font-size="24">&#9835;</text>
    <text x="330" y="140" font-size="18">&#9834;</text>
    <text x="85" y="170" font-size="20">&#9833;</text>
  </g>

  <!-- Beverage glass -->
  <g transform="translate(320, 230)">
    <rect x="-8" y="-20" width="16" height="30" rx="3" fill="#81D4FA" opacity="0.5"/>
    <rect x="-10" y="-22" width="20" height="4" rx="2" fill="#B3E5FC"/>
    <line x1="4" y1="-22" x2="15" y2="-35" stroke="#795548" stroke-width="2"/>
    <circle cx="18" cy="-38" r="5" fill="#FF5722" opacity="0.7"/>
  </g>

  <!-- Caption -->
  <text x="200" y="355" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="16" fill="#2E7D32">
    "After reading the guide"
  </text>

  <!-- smartdecode badge -->
  <g transform="translate(200, 380)">
    <rect x="-70" y="-10" width="140" height="20" rx="10" fill="#43A047" opacity="0.3"/>
    <text x="0" y="5" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#2E7D32">smartdecode=1 FTW</text>
  </g>
</svg>
