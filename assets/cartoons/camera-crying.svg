<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Scene: A sad security camera crying "NO SIGNAL" tears -->

  <!-- Background -->
  <rect width="400" height="400" fill="#f0f4f8" rx="20"/>

  <!-- Wall mount bracket -->
  <rect x="170" y="40" width="60" height="20" rx="4" fill="#666"/>
  <rect x="195" y="55" width="10" height="30" fill="#555"/>

  <!-- Camera body -->
  <g transform="translate(200, 140) rotate(-15)">
    <!-- Main body -->
    <rect x="-60" y="-30" width="120" height="60" rx="10" fill="#37474F"/>
    <rect x="-55" y="-25" width="110" height="50" rx="8" fill="#455A64"/>

    <!-- Lens housing -->
    <circle cx="70" cy="0" r="28" fill="#263238"/>
    <circle cx="70" cy="0" r="22" fill="#1a1a2e"/>
    <circle cx="70" cy="0" r="16" fill="#37474F"/>
    <!-- Red "recording" light that's OFF -->
    <circle cx="-45" cy="-18" r="5" fill="#333" stroke="#555" stroke-width="1"/>

    <!-- Sad face on the camera -->
    <!-- Eyes (sad, droopy) -->
    <ellipse cx="-15" cy="-5" rx="7" ry="9" fill="white"/>
    <ellipse cx="15" cy="-5" rx="7" ry="9" fill="white"/>
    <circle cx="-15" cy="-2" r="4" fill="#1a1a2e"/>
    <circle cx="15" cy="-2" r="4" fill="#1a1a2e"/>
    <!-- Eyebrows (worried) -->
    <line x1="-25" y1="-18" x2="-8" y2="-14" stroke="#CFD8DC" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="-14" x2="25" y2="-18" stroke="#CFD8DC" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Sad mouth -->
    <path d="M-12,12 Q0,6 12,12" fill="none" stroke="#CFD8DC" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Tears (blue droplets) -->
  <g fill="#42A5F5" opacity="0.8">
    <!-- Left tear stream -->
    <ellipse cx="155" cy="175" rx="4" ry="7"/>
    <ellipse cx="150" cy="200" rx="3" ry="6"/>
    <ellipse cx="148" cy="225" rx="4" ry="7"/>
    <ellipse cx="145" cy="255" rx="3" ry="5"/>
    <!-- Right tear stream -->
    <ellipse cx="195" cy="180" rx="4" ry="7"/>
    <ellipse cx="198" cy="210" rx="3" ry="6"/>
    <ellipse cx="200" cy="240" rx="4" ry="7"/>
    <ellipse cx="202" cy="265" rx="3" ry="5"/>
  </g>

  <!-- Puddle of tears -->
  <ellipse cx="175" cy="310" rx="70" ry="15" fill="#42A5F5" opacity="0.3"/>
  <ellipse cx="175" cy="308" rx="50" ry="10" fill="#42A5F5" opacity="0.2"/>

  <!-- "NO SIGNAL" speech bubble -->
  <g transform="translate(290, 100)">
    <rect x="-60" y="-25" width="120" height="50" rx="12" fill="white" stroke="#E53935" stroke-width="2"/>
    <polygon points="-20,25 -30,45 -5,25" fill="white" stroke="#E53935" stroke-width="2"/>
    <polygon points="-19,24 -28,42 -6,24" fill="white"/>
    <text x="0" y="-4" text-anchor="middle" font-family="Impact, sans-serif" font-size="16" fill="#E53935">NO SIGNAL</text>
    <text x="0" y="14" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="11" fill="#666">again?!</text>
  </g>

  <!-- Caption -->
  <text x="200" y="365" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="16" fill="#455A64">
    "I just want to stream..."
  </text>
</svg>
