<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a2a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2137;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iris" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BCD4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="protect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00A3E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0078D4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)" rx="12"/>

  <!-- Grid lines (surveillance aesthetic) -->
  <g opacity="0.08" stroke="#4fc3f7" stroke-width="0.5">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
  </g>

  <!-- Eye/Iris icon -->
  <g transform="translate(120, 80)" filter="url(#glow)">
    <!-- Outer eye shape -->
    <ellipse cx="0" cy="0" rx="45" ry="28" fill="none" stroke="url(#iris)" stroke-width="2.5"/>
    <!-- Iris -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#2196F3" stroke-width="2"/>
    <!-- Pupil -->
    <circle cx="0" cy="0" r="8" fill="#2196F3" opacity="0.8"/>
    <!-- Highlight -->
    <circle cx="-4" cy="-5" r="3" fill="white" opacity="0.7"/>
    <!-- Scanning lines -->
    <line x1="-50" y1="0" x2="-48" y2="0" stroke="#4fc3f7" stroke-width="1" opacity="0.5"/>
    <line x1="48" y1="0" x2="50" y2="0" stroke="#4fc3f7" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Title -->
  <text x="210" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="white" letter-spacing="1">
    Protect Your Iris
  </text>

  <!-- Subtitle -->
  <text x="210" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8bb8e8" letter-spacing="0.5">
    Blue Iris 6 + UniFi Protect Integration Guide
  </text>

  <!-- Tag line -->
  <text x="210" y="135" font-family="Consolas, monospace" font-size="12" fill="#4fc3f7" opacity="0.7">
    Battle-tested on 62 cameras. Written at 3 AM.
  </text>

  <!-- Shield icon (small, right side) -->
  <g transform="translate(700, 100)" opacity="0.4">
    <path d="M0,-30 L25,-18 L25,8 L0,25 L-25,8 L-25,-18 Z" fill="none" stroke="#00A3E0" stroke-width="1.5"/>
    <text x="0" y="3" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#00A3E0">UP</text>
  </g>

  <!-- Bottom border accent -->
  <rect x="0" y="192" width="800" height="8" fill="url(#iris)" rx="0" opacity="0.6"/>

  <!-- Corner accents -->
  <rect x="15" y="15" width="30" height="2" fill="#4fc3f7" opacity="0.3"/>
  <rect x="15" y="15" width="2" height="20" fill="#4fc3f7" opacity="0.3"/>
  <rect x="755" y="15" width="30" height="2" fill="#4fc3f7" opacity="0.3"/>
  <rect x="783" y="15" width="2" height="20" fill="#4fc3f7" opacity="0.3"/>
</svg>
