<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#112240"/>
      <stop offset="100%" style="stop-color:#0d2137"/>
    </linearGradient>
    <linearGradient id="iris" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3"/>
      <stop offset="100%" style="stop-color:#00BCD4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#F7C948"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.05" stroke="#4fc3f7" stroke-width="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Large eye icon on left -->
  <g transform="translate(220, 280)" filter="url(#glow)">
    <ellipse cx="0" cy="0" rx="130" ry="75" fill="none" stroke="url(#iris)" stroke-width="4"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#2196F3" stroke-width="3"/>
    <circle cx="0" cy="0" r="38" fill="#1565C0" opacity="0.5"/>
    <circle cx="0" cy="0" r="20" fill="#2196F3" opacity="0.9"/>
    <circle cx="0" cy="0" r="9" fill="#0D47A1"/>
    <circle cx="-10" cy="-12" r="7" fill="white" opacity="0.7"/>
    <circle cx="5" cy="-5" r="3" fill="white" opacity="0.4"/>
  </g>

  <!-- Title text -->
  <text x="500" y="220" font-family="Segoe UI, Helvetica, sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="2">
    Protect Your Iris
  </text>

  <!-- Subtitle -->
  <text x="500" y="290" font-family="Segoe UI, Helvetica, sans-serif" font-size="28" fill="#8bb8e8" letter-spacing="1">
    Blue Iris 6 + UniFi Protect Integration Guide
  </text>

  <!-- Feature pills -->
  <g transform="translate(500, 340)">
    <rect x="0" y="0" width="180" height="36" rx="18" fill="#2196F3" opacity="0.2" stroke="#2196F3" stroke-width="1"/>
    <text x="90" y="24" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#4fc3f7">62 Cameras Tested</text>

    <rect x="200" y="0" width="160" height="36" rx="18" fill="#00BCD4" opacity="0.2" stroke="#00BCD4" stroke-width="1"/>
    <text x="280" y="24" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#4fc3f7">CPU 100% to 9%</text>

    <rect x="380" y="0" width="170" height="36" rx="18" fill="#FF6B35" opacity="0.2" stroke="#FF6B35" stroke-width="1"/>
    <text x="465" y="24" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#FFB74D">3 Free Scripts</text>
  </g>

  <!-- Tagline -->
  <text x="500" y="440" font-family="Consolas, monospace" font-size="18" fill="#4fc3f7" opacity="0.6">
    Battle-tested. Open source. Written at 3 AM.
  </text>

  <!-- GitHub badge -->
  <g transform="translate(500, 470)">
    <rect x="0" y="0" width="260" height="40" rx="20" fill="white" opacity="0.1"/>
    <text x="130" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="white" opacity="0.8">github.com/pueblokc/protect-your-iris</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="618" width="1200" height="12" fill="url(#iris)" opacity="0.7"/>

  <!-- Corner frames -->
  <g stroke="#4fc3f7" stroke-width="2" opacity="0.2">
    <line x1="30" y1="30" x2="80" y2="30"/>
    <line x1="30" y1="30" x2="30" y2="70"/>
    <line x1="1120" y1="30" x2="1170" y2="30"/>
    <line x1="1170" y1="30" x2="1170" y2="70"/>
    <line x1="30" y1="600" x2="80" y2="600"/>
    <line x1="30" y1="560" x2="30" y2="600"/>
    <line x1="1120" y1="600" x2="1170" y2="600"/>
    <line x1="1170" y1="560" x2="1170" y2="600"/>
  </g>
</svg>
